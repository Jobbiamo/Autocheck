name: Crea APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila l'APK
        run: gradle assembleDebug --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk AutoCheck.apk

      - name: Pubblica sul link "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AutoCheck – ultima versione
          body: |
            Scarica **AutoCheck.apk** dal telefono Android e installalo.
            Versione creata automaticamente dal commit ${{ github.sha }}.
          files: AutoCheck.apk
          make_latest: true
